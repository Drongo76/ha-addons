name: "Tado Assistant (Ingress)"
version: "0.6.7"
slug: tado_assistant
description: "Tado Assistant"

arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

startup: services
boot: auto

# WICHTIG: verhindert docker --init (tini) => s6 bleibt PID1
init: false

ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: "mdi:thermostat"

webui: "http://[HOST]:[PORT:8099]/"

# Minimal und sicher: nur /data schreiben (Tokens etc.)
map:
  - data:rw

# Keine extra Rechte (sauber/standard)
host_network: false
homeassistant_api: false
hassio_api: false
docker_api: false
full_access: false
privileged: []
devices: []
usb: false
uart: false
gpio: false

# Optionen (werden nach /data/options.json gemountet)
options:
  poll_seconds: 30
  mqtt_enabled: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: "tado_assistant"
  mqtt_discovery_prefix: "homeassistant"

schema:
  poll_seconds: int(5,3600)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str?
  mqtt_discovery_prefix: str?
