name: "Tado Assistant (Ingress)"
version: "0.2.1"
slug: tado_assistant
description: "Tado Auto-Assist Alternative als HA Add-on mit Ingress UI + MQTT presence entities."
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

startup: services
boot: auto

# WICHTIG: Damit der Button "Benutzeroberfläche öffnen" da ist
ingress: true
ingress_port: 8099
panel_title: "Tado Assistant"
panel_icon: "mdi:thermostat"

# optional (nur Anzeigehilfe)
webui: "http://[HOST]:[PORT:8099]/"

# Optionen NUR als Platzhalter – keine Passwörter fest reinschreiben
options:
  log_level: info
  mqtt_enable: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  log_level: list(trace|debug|info|warning|error)
  mqtt_enable: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?

# erlaubt Zugriff auf /data (persistente Daten)
map:
  - data:rw
