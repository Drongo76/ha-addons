name: "Tado Assistant (Ingress)"
version: "1.2.5"
slug: tado_assistant
description: "Tado Assistant"

arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

startup: services
boot: auto

# WICHTIG: verhindert docker --init (tini) => s6 bleibt PID1
init: false

# Allow Home Assistant Core API access via Supervisor proxy:
# http://supervisor/core/api/...
homeassistant_api: true

# (Optional) Supervisor API access (not required for core proxy, but useful later)
hassio_api: true
hassio_role: default

schema:
  poll_seconds: int(5,3600)
  presence_poll_seconds: int(30,86400)
  presence_source: list(tado|ha)
  ha_presence_entity: str?
  enable_raw_sensors: bool
  enable_open_window: bool
  open_window_poll_seconds: int(30,3600)
  zones_refresh_seconds: int(300,86400)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str?
  mqtt_discovery_prefix: str?

options:
  presence_source: ha
  ha_presence_entity: group.family
