name: "Tado Assistant (Ingress)"
version: "0.2.5"   # <-- WICHTIG: erhöhen, sonst läuft oft noch das alte Image
slug: tado_assistant
description: "Tado Auto-Assist Alternative als HA Add-on mit Ingress UI + MQTT presence entities."
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

startup: services
boot: auto

ingress: true
ingress_port: 8099
panel_title: "Tado Assistant"
panel_icon: "mdi:thermostat"

map:
  - data:rw

options:
  log_level: info
  mqtt_enable: false
  mqtt_host: "192.168.1.10"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  log_level: list(trace|debug|info|warning|error)
  mqtt_enable: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
