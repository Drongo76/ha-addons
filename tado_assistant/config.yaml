name: "Tado Assistant (Ingress)"
slug: "tado_assistant"
description: "Tado Auto-Assist Alternative als HA Add-on mit Web UI (Ingress) + MQTT Entities."
version: "0.2.7"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: "mdi:radiator"
panel_title: "Tado Assistant"

options:
  poll_seconds: 60
  set_presence: true
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_base_topic: "tado_assistant"

schema:
  poll_seconds: int
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  mqtt_base_topic: str
