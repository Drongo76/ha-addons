name: "Tado Assistant (Ingress)"
slug: "tado_assistant"
version: "0.2.1"
description: "Tado Auto-Assist Alternative: Ingress UI + MQTT presence entities"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
options:
  log_level: info
  mqtt:
    enabled: false
    host: ""
    port: 1883
    username: ""
    password: ""
    discovery_prefix: "homeassistant"
    topic_prefix: "tado_assistant"
schema:
  log_level: list(trace|debug|info|warning|error)
  mqtt:
    enabled: bool
    host: str
    port: int
    username: str?
    password: password?
    discovery_prefix: str
    topic_prefix: str
